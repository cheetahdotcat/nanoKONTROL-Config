[project]
name = "nanokontrol-config"
version = "0.2.0"
description = "Configuration tool for Korg nanoKONTROL"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
dependencies = [
    "alsa-midi; sys_platform == 'linux'",
    "jack-client",
    "pillow",
    "python-rtmidi; sys_platform != 'linux'",
]

[tool.uv]
package = false
