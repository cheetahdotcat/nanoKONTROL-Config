name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # Oldest available runners for widest glibc compatibility
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Build AppImage
        run: packaging/build-appimage.sh "${GITHUB_REF_NAME//\//-}"
        shell: bash

      # Runners have no ALSA sequencer or JACK server, so only check the bundled modules load
      - name: Smoke test
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2 xvfb
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract > /dev/null
          xvfb-run -a squashfs-root/usr/python/bin/python3 -E -s -c \
            "import tkinter, PIL.ImageTk, alsa_midi; tkinter.Tk().destroy(); print('ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.runner }}
          path: dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
